[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawlink"
version = "0.1.0"
description = "Live bridge: Draw ink stream -> vector/CAD/cursor. Separate process from the Draw capture loop."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # DRAL (fio + handshake) e um pacote separado; manter ambos no mesmo SHA.
    "draw-dral @ git+https://github.com/santleme/draw-core@1579f1cc61bf263dd8cc72865eebe1dac0408a1d#subdirectory=packages/draw-dral",
    # draw-core ainda fornece config e vetorizador/exportador para este consumidor.
    "draw-core @ git+https://github.com/santleme/draw-core@1579f1cc61bf263dd8cc72865eebe1dac0408a1d",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
drawlink = "drawlink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 120
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
