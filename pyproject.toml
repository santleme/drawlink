[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawlink"
version = "0.1.0"
description = "Live bridge: Draw ink stream -> vector/CAD/cursor. Separate process from the Draw capture loop."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # Codec do stream (draw.stream) e vetorizador (draw.exporters). Fixado em
    # branch ate a PR santleme/draw-core#60 entrar; depois vira tag.
    "draw-core @ git+https://github.com/santleme/draw-core@stream-ink-tap",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
drawlink = "drawlink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 120
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
